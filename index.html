<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Campus Party - Controle de Voluntários em Nuvem</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Firebase Realtime Database SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Suas chaves do Firebase integradas
    const firebaseConfig = {
      apiKey: "AIzaSyDgL2rC5UqL1Hrdy2Rq26E0-fEbsS_OSqU",
      authDomain: "campus-party-voluntarios.firebaseapp.com",
      databaseURL: "https://campus-party-voluntarios-default-rtdb.firebaseio.com",
      projectId: "campus-party-voluntarios",
      storageBucket: "campus-party-voluntarios.firebasestorage.app",
      messagingSenderId: "1005886477164",
      appId: "1:1005886477164:web:4656364da687ccabc95949"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'voluntarios');

    window.voluntarios = [];

    // ESCUTA EM TEMPO REAL: Atualiza instantaneamente todos os celulares e computadores conectados
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.voluntarios = Array.isArray(data) ? data : Object.values(data);
      } else {
        window.voluntarios = [
          { id: '1', qrcode: '4e-6123699472', nome: 'Lucas Silva', cpf: '123.456.789-00', presente: false, entrada: '--:--', Saida: '--:--' },
          { id: '2', qrcode: '4e-6135589499', nome: 'Mariana Costa', cpf: '987.654.321-11', presente: false, entrada: '--:--', Saida: '--:--' }
        ];
      }
      window.renderizarTabela();
    });

    window.salvarNuvem = function() {
      set(dbRef, window.voluntarios);
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap');
    body { background-color: #0A0E17; color: #E2E8F0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-[#131927] border-b border-slate-800 sticky top-0 z-40 p-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-[#00FF66] text-slate-950 font-bold flex items-center justify-center font-orbitron">CP</div>
        <div>
          <h1 class="font-orbitron font-bold text-sm text-white">CAMPUS PARTY</h1>
          <span class="text-[10px] text-cyan-400 font-sans block leading-none">☁️ Nuvem Ativa</span>
        </div>
      </div>
      <div id="relogioDigital" class="font-orbitron text-xs text-[#00FF66] font-bold">00:00:00</div>
      <div class="flex gap-1.5">
        <label class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 cursor-pointer">
          Importar Excel
          <input type="file" id="inputFileExcel" accept=".xlsx, .csv" class="hidden" onchange="importarExcel(event)">
        </label>
        <button onclick="abrirModalNovoVoluntario()" class="bg-[#00FF66] text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">+ Novo</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full space-y-4">

    <!-- TERMINAL DE PONTO -->
    <section class="bg-[#131927] p-4 rounded-2xl border border-slate-800 space-y-3">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
        <h2 class="text-sm font-bold font-orbitron text-white">Check-in / Check-out Instantâneo</h2>
        <button onclick="abrirModalCamera()" class="bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
          📷 Abrir Câmera do Celular
        </button>
      </div>

      <form onsubmit="processarPontoKiosk(event)" class="flex gap-2">
        <input type="text" id="inputKiosk" placeholder="Escaneie o QR Code ou digite..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-mono text-sm focus:outline-none focus:border-[#00FF66]">
        <button type="submit" class="bg-[#00FF66] text-slate-950 font-bold px-5 py-3 rounded-xl font-orbitron text-xs">REGISTRAR</button>
      </form>
      <div id="msgKiosk" class="text-xs min-h-[20px] font-bold"></div>
    </section>

    <!-- METRICAS -->
    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-[#131927] p-3 rounded-xl border border-slate-800">
        <p class="text-[10px] text-slate-400">Total</p>
        <p id="metricTotal" class="text-lg font-bold font-orbitron text-white">0</p>
      </div>
      <div class="bg-[#131927] p-3 rounded-xl border border-emerald-500/30">
        <p class="text-[10px] text-emerald-400">Presentes</p>
        <p id="metricPresentes" class="text-lg font-bold font-orbitron text-emerald-400">0</p>
      </div>
      <div class="bg-[#131927] p-3 rounded-xl border border-rose-500/30">
        <p class="text-[10px] text-rose-400">Ausentes</p>
        <p id="metricAusentes" class="text-lg font-bold font-orbitron text-rose-400">0</p>
      </div>
    </section>

    <!-- TABELA -->
    <section class="bg-[#131927] rounded-2xl border border-slate-800 p-4 space-y-3">
      <input type="text" id="filtroTexto" oninput="renderizarTabela()" placeholder="Buscar por Nome, CPF ou QR Code..." class="w-full bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-2">
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs min-w-[500px]">
          <thead>
            <tr class="text-slate-400 border-b border-slate-800 pb-2">
              <th class="p-2">Voluntário</th>
              <th class="p-2">QR Code</th>
              <th class="p-2">Status</th>
              <th class="p-2">Entrada/Saída</th>
              <th class="p-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL CÂMERA -->
  <div id="modalCamera" class="fixed inset-0 bg-slate-950/90 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#131927] border border-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-orbitron font-bold text-white text-sm">Escanear QR Code</h3>
        <button onclick="fecharModalCamera()" class="text-white font-bold">✕</button>
      </div>
      <div id="reader" class="w-full rounded-xl overflow-hidden bg-black"></div>
      <button onclick="fecharModalCamera()" class="w-full py-2 bg-slate-800 text-xs rounded-xl text-slate-300">Cancelar</button>
    </div>
  </div>

  <!-- MODAL NOVO VOLUNTÁRIO -->
  <div id="modalNovoVoluntario" class="fixed inset-0 bg-slate-950/90 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#131927] border border-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3">
      <h3 class="font-orbitron font-bold text-white text-sm">Novo Voluntário</h3>
      <form onsubmit="salvarNovoVoluntario(event)" class="space-y-2 text-xs">
        <input type="text" id="novoNome" required placeholder="Nome Completo *" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <input type="text" id="novoCPF" required placeholder="CPF *" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <input type="text" id="novoQRCode" placeholder="Código QR Code (ex: 4e-6123699472)" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-white">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModalNovoVoluntario()" class="px-3 py-1.5 bg-slate-800 rounded">Cancelar</button>
          <button type="submit" class="px-3 py-1.5 bg-[#00FF66] text-slate-950 font-bold rounded">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;

    setInterval(() => {
      document.getElementById('relogioDigital').innerText = new Date().toLocaleTimeString('pt-BR');
    }, 1000);

    // Normaliza textos e remove espaços ocultos para garantir o match no QR Code
    function limparTexto(txt) {
      return String(txt || '').trim().toLowerCase().replace(/[\s\r\n]/g, '');
    }

    window.renderizarTabela = function() {
      const corpo = document.getElementById('tabelaCorpo');
      const filtro = limparTexto(document.getElementById('filtroTexto').value);
      corpo.innerHTML = '';

      let presentes = 0;
      const lista = window.voluntarios || [];

      lista.forEach(v => {
        if (v.presente) presentes++;

        const matchNome = limparTexto(v.nome).includes(filtro);
        const matchCPF = limparTexto(v.cpf).includes(filtro);
        const matchQR = limparTexto(v.qrcode).includes(filtro);

        if (!filtro || matchNome || matchCPF || matchQR) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-2 font-medium text-white">${v.nome}</td>
            <td class="p-2 font-mono text-cyan-400">${v.qrcode || 'N/A'}</td>
            <td class="p-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${v.presente ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}">
                ${v.presente ? 'Presente' : 'Ausente'}
              </span>
            </td>
            <td class="p-2 font-mono text-slate-400">${v.entrada} / ${v.Saida}</td>
            <td class="p-2 text-right">
              <button onclick="alternarPonto('${v.id}')" class="px-2 py-1 rounded font-bold ${v.presente ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}">
                ${v.presente ? 'Out' : 'In'}
              </button>
            </td>
          `;
          corpo.appendChild(tr);
        }
      });

      document.getElementById('metricTotal').innerText = lista.length;
      document.getElementById('metricPresentes').innerText = presentes;
      document.getElementById('metricAusentes').innerText = lista.length - presentes;
    };

    function processarPontoKiosk(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('inputKiosk');
      const codigoLido = limparTexto(input.value);
      const msg = document.getElementById('msgKiosk');

      if (!codigoLido) return;

      const v = window.voluntarios.find(item => 
        limparTexto(item.qrcode) === codigoLido ||
        limparTexto(item.cpf) === codigoLido ||
        limparTexto(item.nome) === codigoLido
      );

      if (v) {
        alternarPonto(v.id);
        msg.className = "text-xs font-bold text-emerald-400";
        msg.innerText = `✓ Registrado: ${v.nome} (${v.presente ? 'CHECK-IN' : 'CHECK-OUT'})`;
        input.value = '';
      } else {
        msg.className = "text-xs font-bold text-rose-400";
        msg.innerText = `✗ Código não encontrado no cadastro: "${input.value.trim()}"`;
      }
    }

    function alternarPonto(id) {
      const v = window.voluntarios.find(item => item.id === id);
      if (!v) return;

      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      if (!v.presente) {
        v.presente = true;
        v.entrada = hora;
      } else {
        v.presente = false;
        v.Saida = hora;
      }

      window.salvarNuvem();
    }

    function abrirModalCamera() {
      document.getElementById('modalCamera').classList.remove('hidden');
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }, false);
      }
      html5QrcodeScanner.render((qrCodeMessage) => {
        document.getElementById('inputKiosk').value = qrCodeMessage;
        processarPontoKiosk();
        fecharModalCamera();
      }, (error) => {});
    }

    function fecharModalCamera() {
      document.getElementById('modalCamera').classList.add('hidden');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error(err));
      }
    }

    function abrirModalNovoVoluntario() { document.getElementById('modalNovoVoluntario').classList.remove('hidden'); }
    function fecharModalNovoVoluntario() { document.getElementById('modalNovoVoluntario').classList.add('hidden'); }

    function salvarNovoVoluntario(e) {
      e.preventDefault();
      window.voluntarios.push({
        id: Date.now().toString(),
        nome: document.getElementById('novoNome').value.trim(),
        cpf: document.getElementById('novoCPF').value.trim(),
        qrcode: document.getElementById('novoQRCode').value.trim(),
        presente: false,
        entrada: '--:--',
        Saida: '--:--'
      });
      window.salvarNuvem();
      fecharModalNovoVoluntario();
    }

    function importarExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        json.forEach(row => {
          const nome = row['Nome'] || row['NOME'];
          if (nome) {
            window.voluntarios.push({
              id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
              nome: String(nome).trim(),
              cpf: String(row['CPF'] || '000.000.000-00').trim(),
              qrcode: String(row['QRCODE'] || row['QR CODE'] || row['qrcode'] || '').trim(),
              presente: false,
              entrada: '--:--',
              Saida: '--:--'
            });
          }
        });
        window.salvarNuvem();
        alert("Planilha importada e sincronizada na nuvem!");
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
